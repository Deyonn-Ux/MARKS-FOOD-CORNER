<!DOCTYPE html>
<html>
<head>
    <title>Recommended Food</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #0f172a;
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

.box {
    max-width: 900px;
    margin: 50px auto;
    background: #1e293b;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
}

.card {
    background: #111827;
    border-radius: 15px;
    color: white;
    padding: 10px;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

img {
    border-radius: 10px;
}

.btn-add {
    background: #22c55e;
    border: none;
    border-radius: 10px;
}

.btn-add:hover {
    background: #16a34a;
}

.btn-skip {
    background: #64748b;
    border: none;
    border-radius: 10px;
}

.btn-skip:hover {
    background: #475569;
}
</style>
</head>

<body>

<div class="box">

    <h3 class="mb-4">🔥 You might also like...</h3>

    <div class="row">

        {% for food in recommends %}
        <div class="col-md-4 mb-3">

            <div class="card">

                {% if food.image %}
                <img src="{{food.image.url}}" style="height:150px; width:100%; object-fit:cover;">
                {% endif %}

                <h5 class="mt-2">{{food.name}}</h5>
                <p class="text-warning fw-bold">₱{{food.price}}</p>

                <!-- ✅ ADD & GO TO PAYMENT -->
                <a href="/add/{{food.id}}/?next=payment" class="btn btn-add w-100 mb-2">
                    ➕ Add & Proceed to Payment
                </a>

            </div>

        </div>
        {% endfor %}

    </div>

    <!-- ✅ SKIP → GO TO PAYMENT -->
    <a href="/checkout/" class="btn btn-skip w-100 mt-3">
        ❌ No Thanks, Proceed to Payment
    </a>

</div>

</body>
</html>
