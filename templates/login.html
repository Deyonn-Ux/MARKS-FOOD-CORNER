<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: radial-gradient(circle at top, rgba(59,130,246,0.15), transparent 28%),
                linear-gradient(180deg, #020617 0%, #0a122b 100%);
    color:#e2e8f0;
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    margin:0;
}

.box {
    max-width:420px;
    margin:80px auto;
    background: rgba(15,23,42,0.95);
    padding: 30px 28px;
    border-radius:22px;
    box-shadow: 0 24px 80px rgba(15,23,42,0.55);
    border: 1px solid rgba(148,163,184,0.18);
}

.box h3 {
    color:#f8fafc;
    margin-bottom:24px;
}

.form-label {
    display:block;
    text-align:left;
    margin-bottom:8px;
    color:#cbd5e1;
    font-weight:600;
}

.helper-text {
    font-size:0.92rem;
    color:#94a3b8;
    text-align:left;
    margin-top:6px;
}

.alert {
    border-radius:14px;
}
</style>
</head>

<body>

<div class="box">

<h3 class="text-center">🔐 Login</h3>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} text-start py-2" role="alert">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">
{% csrf_token %}

<div class="mb-4">
    <label class="form-label" for="username">Username</label>
    <input id="username" type="text" name="username" placeholder="Enter your username" class="form-control" required>
    <div class="helper-text">Type the username you registered with.</div>
</div>

<div class="mb-4">
    <label class="form-label" for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Enter your password" class="form-control" required>
    <div class="helper-text">Make sure caps lock is off and your password is correct.</div>
</div>

<button class="btn btn-success w-100 py-2">Login</button>

</form>

<p class="mt-3 text-center">
No account? <a href="/register/">Register</a>
</p>

</div>

</body>
</html>
