<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .box {
            max-width: 520px;
            margin: 60px auto;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 24px;
        }
        .form-control, .form-select {
            background: #020617;
            color: white;
            border-color: #334155;
        }
        @media (max-width: 640px) {
            .box { margin: 24px 12px; padding: 18px; }
        }
    </style>
</head>
<body>
<div class="box">
    <h1 class="h3">Review Order #{{ order.id }}</h1>
    <p class="text-secondary">Tell us how the food and service went.</p>
    <form method="POST">
        {% csrf_token %}
        <label class="form-label">Rating</label>
        <select name="rating" class="form-select mb-3">
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Good</option>
            <option value="3">3 - Okay</option>
            <option value="2">2 - Needs improvement</option>
            <option value="1">1 - Poor</option>
        </select>
        <label class="form-label">Comment</label>
        <textarea name="comment" class="form-control mb-3" rows="4" placeholder="Write your feedback"></textarea>
        <button class="btn btn-success w-100">Submit Review</button>
    </form>
    <a href="/orders/" class="btn btn-secondary w-100 mt-2">Back to Orders</a>
</div>
</body>
</html>
